[tool.poetry]
name = "llming-stage"
version = "0.1.2"
description = "Shared frontend foundation and SPA app shell for the llming ecosystem — vendor JS, fonts, icons, and a lazy-loading client-side router"
authors = ["Michael Ikemann"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Alyxion/llming-stage"
homepage = "https://github.com/Alyxion/llming-stage"
keywords = ["spa", "frontend", "assets", "vue", "quasar", "starlette", "lazy-loading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
packages = [{include = "llming_stage"}]
include = [
    {path = "llming_stage/assets/*.zip", format = ["sdist", "wheel"]},
    {path = "llming_stage/vendor/*", format = ["sdist", "wheel"]},
    {path = "llming_stage/fonts/*", format = ["sdist", "wheel"]},
    {path = "llming_stage/lang/*", format = ["sdist", "wheel"]},
    {path = "llming_stage/static/*", format = ["sdist", "wheel"]},
    {path = "THIRD_PARTY.md", format = ["sdist", "wheel"]},
]

[tool.poetry.urls]
"Author" = "https://github.com/Alyxion"

[tool.poetry.dependencies]
python = ">=3.14,<4"
starlette = ">=0.27"
llming-com = ">=0.1.5,<0.2"
uvicorn = {extras = ["standard"], version = ">=0.27"}
# psutil is opt-in: only needed for the `metrics` query in the debug
# WebSocket (CPU%, RSS, threads, FDs). The bridge already returns a
# friendly `{"error": "psutil not installed"}` payload otherwise.
# Install with `pip install llming-stage[debug]` to enable.
psutil = {version = ">=5.9", optional = true}

[tool.poetry.extras]
debug = ["psutil"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-playwright = ">=0.5"
pytest-timeout = ">=2.2"
httpx = ">=0.27"
websockets = ">=12"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
fastapi = ">=0.100"
python-multipart = ">=0.0.9"
# Pull psutil into the dev env so the metrics test passes locally.
psutil = ">=5.9"

[tool.poetry.scripts]
content-guard = "scripts.content_guard:main"
llming-stage = "llming_stage.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "sample(name): sample directory to launch as a server subprocess",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
